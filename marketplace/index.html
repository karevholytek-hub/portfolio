<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Карточки товаров | Портфолио</title>
<style>
:root{color-scheme:light;--ink:#20211f;--muted:#696c67;--line:#e4e3de;--paper:#f7f7f4;--white:#fff;--accent:#303c34}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:10px 14px}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #758d79;outline-offset:3px}button.primary{background:var(--accent);color:white;border-color:var(--accent)}main{max-width:1380px;margin:auto;padding:48px clamp(16px,4vw,64px) 64px}header{display:flex;justify-content:space-between;align-items:end;gap:18px;padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:26px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:0 0 8px}h1{font-size:clamp(28px,4vw,47px);font-weight:600;letter-spacing:-.04em;margin:0;line-height:1.15}p{margin:0}.sub{margin-top:10px;color:var(--muted);font-size:14px}.count{white-space:nowrap;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr));gap:24px}.card{min-width:0;background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.cover{width:100%;display:block;padding:0;border:0;border-radius:0;background:#efefec;position:relative;aspect-ratio:3/4;overflow:hidden}.cover img,.cover video{width:100%;height:100%;object-fit:contain;display:block}.tag{position:absolute;right:10px;bottom:10px;border-radius:5px;background:rgba(25,26,25,.78);color:white;font-size:11px;padding:4px 8px}.details{padding:14px 16px 16px}.details h2{font-size:16px;line-height:1.3;margin:0 0 4px;font-weight:600;overflow-wrap:anywhere}.details p{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.empty{padding:54px 20px;text-align:center;border:1px dashed #d3d4ce;border-radius:12px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 20px}.notice{font-size:13px;color:var(--muted);margin:0 0 18px}.editor{padding:16px;background:white;border:1px solid var(--line);border-radius:12px;margin-bottom:24px}.field{display:grid;gap:5px;margin:0 0 12px}.field input{width:100%;padding:9px 12px;border:1px solid #d1d2cc;border-radius:6px;background:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.media-list{display:grid;gap:7px;margin-top:12px}.media-row{display:flex;gap:6px;align-items:center;min-width:0;border-top:1px solid var(--line);padding:7px 0}.media-row span{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}.media-row button{padding:6px 10px}.status{color:#8b3325;margin-bottom:12px;white-space:pre-wrap}dialog{border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink);width:min(94vw,1100px);max-height:94dvh;padding:0;overflow:auto}dialog::backdrop{background:rgba(16,18,17,.78)}.viewer-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.viewer-head h2{margin:0;font-size:17px;overflow-wrap:anywhere}.viewer-head button{padding:6px 12px;flex-shrink:0}.stage{position:relative;display:grid;place-items:center;background:#ecece8;height:min(64dvh,750px);min-height:160px;overflow:hidden}.stage img,.stage video{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}.step{position:absolute;z-index:1;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.94);box-shadow:0 1px 6px #0002;width:42px;height:42px;padding:0;font-size:24px;line-height:1}.prev{left:9px}.next{right:9px}.viewer-foot{padding:12px 16px}.progress{font-size:13px;color:var(--muted);margin-bottom:8px}.thumbs{display:flex;gap:8px;overflow:auto;padding:3px 3px 7px}.thumb{flex:0 0 63px;height:78px;padding:3px;overflow:hidden;border-radius:6px;display:grid;place-items:center;background:#f1f1ed;font-size:12px}.thumb[aria-current=true]{outline:2px solid var(--accent);outline-offset:0}.thumb img{width:100%;height:100%;object-fit:contain}.unavailable{display:grid;place-items:center;padding:14px;height:100%;color:var(--muted);font-size:13px;text-align:center}.video-symbol{font-size:23px}.edit-card{margin-top:12px;width:100%}[hidden]{display:none!important}
@media(max-width:560px){main{padding-top:28px}header{align-items:start;flex-direction:column;gap:8px;margin-bottom:18px;padding-bottom:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.details{padding:10px}.details h2{font-size:14px}.details p{font-size:12px}.stage{height:57dvh}.viewer-head,.viewer-foot{padding:10px}.thumb{flex-basis:53px;height:65px}.step{width:36px;height:36px}.editor{padding:12px}}
@media(max-width:340px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header><div><p class="eyebrow">Портфолио / Маркетплейсы</p><h1>Карточки товаров</h1><p class="sub">Дизайн, инфографика и видео</p></div><span id="count" class="count" aria-live="polite"></span></header>
<section id="editTools" hidden><p class="notice">Редактор сохраняет черновики только в этом браузере. Для публикации скачайте ZIP и разместите его содержимое в папке marketplace репозитория.</p><div class="tools"><button class="primary" id="add">+ Новая карточка</button><button id="export">Скачать ZIP для публикации</button><button id="reset">Сбросить черновик</button></div></section>
<p id="status" class="status" role="status"></p>
<section id="editor" class="editor" hidden><h2 id="editTitle">Карточка</h2><label class="field">Название<input id="title" maxlength="120" required></label><label class="field">Описание (необязательно)<input id="desc" maxlength="300"></label><label class="field">Изображения и видео (до 10)<input id="files" type="file" accept=".jpg,.jpeg,.png,.webp,.avif,.gif,.bmp,.mp4,.webm,.mov,.m4v,.ogv" multiple></label><p id="fileCount" class="notice"></p><div id="mediaList" class="media-list"></div><div class="actions"><button id="save" class="primary">Сохранить</button><button id="cancel">Отмена</button><button id="remove" hidden>Удалить карточку</button></div></section>
<section id="grid" class="grid" aria-label="Работы"></section>
<div id="empty" class="empty" hidden><strong>Галерея пока пуста</strong><span>Карточки появятся здесь после публикации.</span></div>
<noscript>Для просмотра галереи включите JavaScript.</noscript>
</main>
<dialog id="viewer" aria-label="Просмотр карточки">
<div class="viewer-head"><h2 id="viewTitle"></h2><button id="close" aria-label="Закрыть">Закрыть ×</button></div>
<div class="stage" id="stage"><button class="step prev" id="prev" aria-label="Предыдущий материал">‹</button><div id="large" style="width:100%;height:100%;min-height:0;min-width:0"></div><button class="step next" id="next" aria-label="Следующий материал">›</button></div>
<div class="viewer-foot"><p class="progress" id="progress" aria-live="polite"></p><div id="thumbs" class="thumbs"></div></div>
</dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), editing=new URLSearchParams(location.search).get('edit')==='1', MAX=10;
let cards=[],published=[],draft=null,editIndex=-1,current=null,position=0,db=null;
const urls=new Map(), extKind=name=>/\.(jpe?g|png|webp|avif|gif|bmp)$/i.test(name)?'image':/\.(mp4|webm|mov|m4v|ogv)$/i.test(name)?'video':null;
const el=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x};
const message=s=>{$('status').textContent=s||''};
function validUrl(s){if(typeof s!=='string')return false;return /^media\/[a-zA-Z0-9_./-]+$/.test(s)&&!s.split('/').includes('..')||/^https:\/\//i.test(s)}
function normalize(data){if(!Array.isArray(data))throw Error('Неверный формат каталога');return data.map((c,i)=>({id:String(c.id||i),title:String(c.title||'Без названия').slice(0,120),desc:String(c.desc||'').slice(0,300),media:Array.isArray(c.media)?c.media.filter(m=>m&&validUrl(m.src)&&['image','video'].includes(m.kind)).slice(0,MAX).map(m=>({kind:m.kind,src:m.src,name:String(m.name||m.src.split('/').pop())})):[]})).filter(c=>c.media.length)}
function source(m){if(!m.blob)return m.src;if(!urls.has(m.blob))urls.set(m.blob,URL.createObjectURL(m.blob));return urls.get(m.blob)}
function mediaNode(m,mode,alt){if(m.kind==='video'&&mode==='thumb')return el('span','video-symbol','▶');let x=el(m.kind==='image'?'img':'video');if(m.kind==='image'){x.alt=alt;x.loading=mode==='cover'?'lazy':'eager';x.decoding='async'}else{x.playsInline=true;x.preload='metadata';x.muted=mode!=='large';x.controls=mode==='large';x.setAttribute('aria-label',alt)}x.addEventListener('error',()=>{x.replaceWith(el('div','unavailable','Материал недоступен'))},{once:true});x.src=source(m);return x}
function pruneUrls(){const keep=new Set(cards.flatMap(c=>c.media.map(m=>m.blob)).concat(draft?draft.media.map(m=>m.blob):[]));for(const [b,u] of urls)if(!keep.has(b)){URL.revokeObjectURL(u);urls.delete(b)}}
function render(){const g=$('grid');g.replaceChildren();$('count').textContent=cards.length+' · '+cards.reduce((s,c)=>s+c.media.length,0)+' материалов';$('empty').hidden=cards.length>0;for(const [i,c] of cards.entries()){let a=el('article','card'),b=el('button','cover');b.type='button';b.setAttribute('aria-label','Открыть: '+c.title);b.append(mediaNode(c.media[0],'cover',c.title),el('span','tag',(c.media[0].kind==='video'?'▶ · ':'')+c.media.length));b.onclick=()=>open(c);let d=el('div','details');d.append(el('h2','',c.title));if(c.desc)d.append(el('p','',c.desc));if(editing){let e=el('button','edit-card','Редактировать');e.onclick=()=>startEdit(i);d.append(e)}a.append(b,d);g.append(a)}pruneUrls()}
function open(c){current=c;position=0;$('viewTitle').textContent=c.title;$('viewer').showModal();view()}
function view(){let m=current.media[position];$('large').replaceChildren(mediaNode(m,'large',current.title+' — '+(position+1)));$('progress').textContent=(position+1)+' / '+current.media.length+' · '+(m.kind==='video'?'Видео':'Изображение');$('prev').hidden=$('next').hidden=current.media.length<2;$('prev').disabled=position===0;$('next').disabled=position===current.media.length-1;let t=$('thumbs');t.replaceChildren();current.media.forEach((a,i)=>{let b=el('button','thumb');b.setAttribute('aria-label','Материал '+(i+1));b.setAttribute('aria-current',String(i===position));b.append(mediaNode(a,'thumb',current.title+' '+(i+1)));b.onclick=()=>{position=i;view()};t.append(b)});t.children[position].scrollIntoView({block:'nearest',inline:'nearest'})}
function step(d){if(current&&position+d>=0&&position+d<current.media.length){position+=d;view()}}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('close').onclick=()=>$('viewer').close();$('viewer').addEventListener('close',()=>{$('large').replaceChildren();$('thumbs').replaceChildren();current=null});$('viewer').addEventListener('click',e=>{if(e.target===$('viewer'))$('viewer').close()});document.addEventListener('keydown',e=>{if(!$('viewer').open||e.target.tagName==='VIDEO')return;if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}if(e.key==='ArrowRight'){e.preventDefault();step(1)}});
let touchX=0,touchY=0;$('stage').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;touchY=e.changedTouches[0].clientY},{passive:true});$('stage').addEventListener('touchend',e=>{if(e.target.closest('video,button'))return;let d=e.changedTouches[0].clientX-touchX,y=e.changedTouches[0].clientY-touchY;if(Math.abs(d)>55&&Math.abs(d)>Math.abs(y)*1.5)step(d<0?1:-1)},{passive:true});
function database(){return new Promise((ok,no)=>{let r=indexedDB.open('marketplace-gallery-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function stored(){return new Promise((ok,no)=>{let r=db.transaction('data').objectStore('data').get('cards');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function persist(value){return new Promise((ok,no)=>{let t=db.transaction('data','readwrite');t.objectStore('data').put(value,'cards');t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})}
function startEdit(i){editIndex=i;let c=cards[i];draft=c?{...c,media:[...c.media]}:{id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),title:'',desc:'',media:[]};$('editTitle').textContent=c?'Редактирование':'Новая карточка';$('title').value=draft.title;$('desc').value=draft.desc;$('files').value='';$('remove').hidden=i<0;$('editor').hidden=false;message('');renderMedia();$('editor').scrollIntoView({block:'start'});$('title').focus()}
function renderMedia(){let l=$('mediaList');l.replaceChildren();$('fileCount').textContent=draft.media.length+' / '+MAX+' материалов. Первый материал — обложка.';for(const [i,m] of draft.media.entries()){let r=el('div','media-row');r.append(el('span','',(i+1)+'. '+m.name));for(const [label,act,disabled] of [['↑',()=>{[draft.media[i-1],draft.media[i]]=[draft.media[i],draft.media[i-1]]},i===0],['↓',()=>{[draft.media[i+1],draft.media[i]]=[draft.media[i],draft.media[i+1]]},i===draft.media.length-1],['×',()=>draft.media.splice(i,1),false]]){let b=el('button','',label);b.disabled=disabled;b.setAttribute('aria-label',label==='↑'?'Выше':label==='↓'?'Ниже':'Удалить материал');b.onclick=()=>{act();renderMedia()};r.append(b)}l.append(r)}}
$('files').onchange=e=>{let fs=Array.from(e.target.files);e.target.value='';if(!draft)return;if(fs.length+draft.media.length>MAX){message('Не более 10 материалов на карточку. Выберите меньше файлов.');return}if(fs.some(f=>!extKind(f.name))){message('Неподдерживаемый формат файла.');return}for(let f of fs)draft.media.push({name:f.name,kind:extKind(f.name),blob:f});message('');renderMedia()};
function endEdit(){$('editor').hidden=true;draft=null;editIndex=-1;pruneUrls()}
$('add').onclick=()=>startEdit(-1);$('cancel').onclick=()=>{endEdit();message('')};
async function commit(next){try{await persist(next);cards=next;endEdit();render();message('Черновик сохранён в браузере.')}catch(e){message('Не удалось сохранить: '+(e.message||'недостаточно места'))}}
$('save').onclick=()=>{if(!draft)return;let title=$('title').value.trim();if(!title||!draft.media.length){message('Введите название и добавьте хотя бы один материал.');return}let c={...draft,title,desc:$('desc').value.trim()},next=[...cards];if(editIndex<0)next.push(c);else next[editIndex]=c;commit(next)};
$('remove').onclick=()=>{if(editIndex>=0&&confirm('Удалить карточку из черновика?'))commit(cards.filter((_,i)=>i!==editIndex))};$('reset').onclick=()=>{if(confirm('Удалить локальный черновик и загрузить опубликованный каталог?'))commit(structuredClone(published))};
const crcTable=Uint32Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0});
async function zip(entries){const parts=[],central=[];let offset=0,centralSize=0;const enc=new TextEncoder();for(const [path,blob] of entries){let n=enc.encode(path),data=new Uint8Array(await blob.arrayBuffer()),crc=0xffffffff;for(const byte of data)crc=(crc>>>8)^crcTable[(crc^byte)&255];crc=(crc^0xffffffff)>>>0;if(offset+data.length>0xffffffff)throw Error('Архив превышает 4 ГБ');let l=new Uint8Array(30+n.length),v=new DataView(l.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,n.length,true);l.set(n,30);let c=new Uint8Array(46+n.length),w=new DataView(c.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x800,true);w.setUint32(16,crc,true);w.setUint32(20,data.length,true);w.setUint32(24,data.length,true);w.setUint16(28,n.length,true);w.setUint32(42,offset,true);c.set(n,46);parts.push(l,blob);central.push(c);offset+=l.length+data.length;centralSize+=c.length}if(entries.length>65535||offset+centralSize>0xffffffff)throw Error('Архив слишком большой');let end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,entries.length,true);v.setUint16(10,entries.length,true);v.setUint32(12,centralSize,true);v.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/zip'})}
$('export').onclick=async()=>{if(draft){message('Сохраните или отмените редактирование перед экспортом.');return}let b=$('export');b.disabled=true;try{let entries=[],manifest=cards.map(c=>({id:c.id,title:c.title,desc:c.desc,media:c.media.map((m,i)=>{let src=m.src;if(m.blob){let ext=m.name.split('.').pop().toLowerCase(),id=c.id.replace(/[^a-zA-Z0-9_-]/g,'_');src='media/'+id+'/'+(i+1)+'.'+ext;entries.push([src,m.blob])}return{kind:m.kind,name:m.name,src}})}));entries.unshift(['catalog.json',new Blob([JSON.stringify(manifest,null,2)],{type:'application/json'})]);let u=URL.createObjectURL(await zip(entries)),a=el('a');a.href=u;a.download='marketplace-publication.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000);message('ZIP сформирован. Распакуйте его в папку marketplace репозитория.')}catch(e){message('Ошибка экспорта: '+e.message)}finally{b.disabled=false}};
(async()=>{try{let r=await fetch('catalog.json',{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);published=normalize(await r.json());cards=structuredClone(published)}catch(e){message('Не удалось загрузить опубликованный каталог: '+e.message)}if(editing){try{db=await database();let saved=await stored();if(Array.isArray(saved))cards=saved;$('editTools').hidden=false}catch(e){message('Локальное хранилище недоступно: '+e.message)}}render()})();
</script>
</body></html>
