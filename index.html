<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портфолио</title>
  <meta property="og:title" content="Портфолио">
  <meta property="og:description" content="Карточки товаров с галереями">
  <meta property="og:image" content="https://via.placeholder.com/1200x630/1a1a1a/ffffff?text=Portfolio">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #eee; line-height: 1.5; }
    .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    h1 { text-align: center; margin-bottom: 40px; font-weight: 500; }

    /* Product Card */
    .product-card {
      background: #1a1a1a;
      border-radius: 16px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 140px;
      gap: 16px;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .main-image {
      width: 100%;
      height: 520px;
      object-fit: cover;
      border-radius: 12px;
      background: #222;
    }
    .thumbs {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .thumb {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 3px solid transparent;
      transition: border 0.2s, opacity 0.2s;
      opacity: 0.7;
    }
    .thumb.active, .thumb:hover {
      border-color: #4ade80;
      opacity: 1;
    }
    .info {
      grid-column: 1 / -1;
      padding-top: 10px;
    }
    .title { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
    .badge {
      display: inline-block;
      background: #4ade80;
      color: #000;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .desc { color: #aaa; font-size: 16px; }

    @media (max-width: 700px) {
      .product-card { grid-template-columns: 1fr; }
      .main-image { height: 380px; }
      .thumbs { flex-direction: row; overflow-x: auto; }
      .thumb { min-width: 90px; height: 90px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Портфолио</h1>

    <div class="product-card" id="product">
      <img class="main-image" id="mainImg" src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=800&q=80" alt="Оверсайз худи">
      <div class="thumbs">
        <img class="thumb active" src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=300&q=80" data-full="https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=800&q=80" alt="">
        <img class="thumb" src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=300&q=80" data-full="https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=800&q=80" alt="">
        <img class="thumb" src="https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?w=300&q=80" data-full="https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?w=800&q=80" alt="">
        <img class="thumb" src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=300&q=80" data-full="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=800&q=80" alt="">
      </div>
      <div class="info">
        <div class="badge">СВОБОДНАЯ ПОСАДКА</div>
        <div class="title">ОВЕРСАЙЗ ХУДИ</div>
        <p class="desc">Качественный оверсайз худи. Капюшон, манжеты, карман. Кликни по миниатюрам справа — фото меняется без перезагрузки страницы.</p>
      </div>
    </div>
  </div>

  <script>
    const mainImg = document.getElementById('mainImg');
    const thumbs = document.querySelectorAll('.thumb');

    thumbs.forEach(thumb => {
      thumb.addEventListener('click', () => {
        mainImg.src = thumb.dataset.full;
        thumbs.forEach(t => t.classList.remove('active'));
        thumb.classList.add('active');
      });
    });
  </script>
</body>
</html>
