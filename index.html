<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портфолио</title>
  <meta property="og:title" content="Оверсайз Худи">
  <meta property="og:description" content="Карточка товара с галереей">
  <meta property="og:image" content="https://i.img402.dev/nhe7w6qcad.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #eee; line-height: 1.5; }
    .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    h1 { text-align: center; margin-bottom: 50px; font-weight: 500; }

    .product-card {
      background: #1a1a1a;
      border-radius: 16px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 140px;
      gap: 16px;
      padding: 20px;
      margin-bottom: 40px;
    }
    .main-image {
      width: 100%;
      height: 520px;
      object-fit: cover;
      border-radius: 12px;
      background: #222;
    }
    .thumbs {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .thumb {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 3px solid transparent;
      transition: border 0.2s, opacity 0.2s;
      opacity: 0.7;
    }
    .thumb.active, .thumb:hover {
      border-color: #4ade80;
      opacity: 1;
    }
    .info {
      grid-column: 1 / -1;
      padding-top: 10px;
    }
    .title { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
    .badge {
      display: inline-block;
      background: #4ade80;
      color: #000;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .desc { color: #aaa; font-size: 16px; }

    @media (max-width: 700px) {
      .product-card { grid-template-columns: 1fr; }
      .main-image { height: 380px; }
      .thumbs { flex-direction: row; overflow-x: auto; }
      .thumb { min-width: 90px; height: 90px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Портфолио</h1>

    <div class="product-card" data-product>
      <img class="main-image" src="https://i.img402.dev/nhe7w6qcad.png" alt="Оверсайз худи">
      <div class="thumbs">
        <img class="thumb active" src="https://i.img402.dev/nhe7w6qcad.png" data-full="https://i.img402.dev/nhe7w6qcad.png" alt="">
        <img class="thumb" src="https://i.img402.dev/jo598488mj.png" data-full="https://i.img402.dev/jo598488mj.png" alt="">
        <img class="thumb" src="https://i.img402.dev/g5226yd7fb.png" data-full="https://i.img402.dev/g5226yd7fb.png" alt="">
        <img class="thumb" src="https://i.img402.dev/k8z0cwix61.png" data-full="https://i.img402.dev/k8z0cwix61.png" alt="">
        <img class="thumb" src="https://i.img402.dev/h5oy4luy2b.png" data-full="https://i.img402.dev/h5oy4luy2b.png" alt="">
      </div>
      <div class="info">
        <div class="badge">СВОБОДНЫЙ КРОЙ</div>
        <div class="title">ОВЕРСАЙЗ ХУДИ</div>
        <p class="desc">Комфорт в каждом движении. Мягкий хлопок, свободный крой, карман-кенгуру. Главное фото — последняя картинка. Кликни по миниатюрам справа.</p>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('[data-product]').forEach(card => {
      const mainImg = card.querySelector('.main-image');
      const thumbs = card.querySelectorAll('.thumb');

      thumbs.forEach(thumb => {
        thumb.addEventListener('click', () => {
          mainImg.src = thumb.dataset.full;
          thumbs.forEach(t => t.classList.remove('active'));
          thumb.classList.add('active');
        });
      });
    });
  </script>
</body>
</html>
