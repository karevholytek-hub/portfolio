name: Reassemble marketplace video
on:
  push:
    branches: [marketplace-video-transfer-20261124]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and reassemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p marketplace/media/choker
          cat transfer-video-20261124/part-{0,1,2,3,4,5,6,7} > marketplace/media/choker/11.mp4
          echo "64d7349f1dd1c5b1803f41998c37cce93b0b9453669ca8acd462edb17894ef59  marketplace/media/choker/11.mp4" | sha256sum -c -
          test "$(git hash-object marketplace/media/choker/11.mp4)" = "17c5df50c85e0e6cf9909cb317f9fade890d8cda"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace/media/choker/11.mp4
          git commit -m "Reassemble and verify exact marketplace video"
          git push origin HEAD:marketplace-video-transfer-20261124
