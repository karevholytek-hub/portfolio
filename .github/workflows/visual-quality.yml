name: Visual QA — preflight on every change
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      strict_release:
        description: "Check all G01-G08 proofs (expected to fail until truly ready)"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  preflight:
    name: Manifest + units + Chromium responsive checks
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Protect against false PASS
        run: |
          python -m unittest discover -s qa -p 'test_*.py' -v
          python qa/check_release.py --mode lint
      - name: Require strict acceptance when public site files change
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || github.event.before }}
          DIFF_MODE: ${{ github.event_name }}
        run: python qa/check_change_scope.py --base "$DIFF_BASE" --mode "$DIFF_MODE"
      - name: Install Chromium for Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test real served HTML and touch
        run: python qa/browser_smoke.py --site . --out qa-artifacts
      - name: Keep screenshots and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Optional strict release approval gate
        if: github.event_name == 'workflow_dispatch' && inputs.strict_release
        run: python qa/check_release.py --mode release
